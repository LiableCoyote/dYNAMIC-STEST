# Build + smoke-test on every push/PR; deploy to GitHub Pages only from main.
name: Build and deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments; don't cancel in-progress builds on other branches.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Always runs: install, build, smoke-test. Gates every branch and PR.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build game
        run: npm run build
      - name: Smoke test
        run: npm run smoke
      - name: Upload Pages artifact
        # Produce the deploy artifact for main and for the active conversion branch
        # (the project lives on the feature branch, unmerged, so it hosts from there).
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/dynamic-social-democracy-feasibility-k9y82t'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out/html'

  # Deploys the artifact from build; main or the active conversion branch.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/dynamic-social-democracy-feasibility-k9y82t'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
